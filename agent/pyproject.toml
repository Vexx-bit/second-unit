[project]
name = "second-unit-agent"
version = "0.1.0"
description = "Autonomous render-farm incident investigator built on Google ADK"
requires-python = ">=3.11"

# HACKATHON CONSTRAINT: Google AI tooling only. Non-Google AI model providers
# and third-party agent frameworks are forbidden.
# See scripts/check-ai-compliance.sh — CI fails the build if one appears here.
dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0",
    "python-dotenv>=1.0.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
